  - Get Started:
      - Install PyDeck: get-started/install.md
      - Your first button: get-started/first-button.md
      - Troubleshooting: get-started/troubleshooting.md

  - Using PyDeck:
      - Devices: using/devices.md
      - Profiles & folders: using/profiles-and-folders.md
      - Action Builder: using/actions.md
      - Install plugins & themes: using/marketplace.md
      - Appearance & themes: using/appearance.md
      - Gradient backgrounds: using/gradient-backgrounds.md
      - Virtual decks & phone control: using/virtual-decks.md
      - Security, LAN & HTTPS: using/security.md
      - Keyboard shortcuts: using/keyboard-shortcuts.md
      - Updating PyDeck: using/updates.md

  - Build Plugins:
      - Getting started: plugins/getting-started.md
      - Plugin Creator (scaffold): plugins/pdk-create.md
      - Templates & elements: plugins/templates.md
      - Rendering & styling: plugins/rendering.md
      - Runtime & the ctx object: plugins/runtime.md
      - Press, hold & events: plugins/events.md
      - manifest.json reference: plugins/manifest.md
      - UI field types: plugins/ui-fields.md
      - Authentication & credentials: plugins/authentication.md
      - Assets & plugin web UI: plugins/assets.md
      - Bundled documentation: plugins/documentation.md
      - Publishing to the catalog: plugins/publishing.md

  - Build Themes:
      - Getting started: themes/getting-started.md
      - CSS variable reference: themes/css-reference.md
      - Examples: themes/examples.md
      - Publishing themes: themes/publishing.md

  - Reference:
      - HTTP & WebSocket API: reference/http-api.md
      - API cookbook: reference/api-cookbook.md
      - API tokens: reference/api-tokens.md
      - Config & file paths: reference/paths.md
      - Developer options: reference/developer-options.md
      - Glossary: reference/glossary.md

  - Internals:
      - Server architecture: internals/architecture.md
      - The api/ package: internals/api-layer.md
      - Route inventory: internals/routes.md
      - lib/ service modules: internals/lib-services.md
      - Access control: internals/security.md
